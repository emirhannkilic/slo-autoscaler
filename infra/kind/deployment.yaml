apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-target
  labels:
    app: load-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-target
  template:
    metadata:
      labels:
        app: load-target
    spec:
      containers:
        - name: load-target
          image: autoscaler-load-target:ci
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
