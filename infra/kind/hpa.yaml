apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: load-target
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: load-target
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
